[workspace]
members = [
    # Contrats feuilles ABI, Wire, Font & bibliothèques de formats purs (Vague W0)
    "exo-abi",
    "exo-wire",
    "exo-srv-rt",
    "exo-font",
    "exo-verity",
    "exo-partition",
    "exo-fscrypt",
    "exo-fs-formats",
    # Bibliothèques kernel-space internes présentes dans ce dépôt
    "exo_types",
    "exo_allocator",
    "exo_text",
    "exo-observability",
    "exo-service-catalog",
    # Bibliothèque SSR ExoPhoenix (GI-01 Étape 10)
    "exo-phoenix-ssr",
    # Bibliothèques Ring3 — runtime userspace
    "exo-alloc",
    "exo-syscall",
    "exo-rt",
    "exo-libc",
    "generic-rt",
    "exo-pkg",
    # musl-exo exclu : projet C (pas Cargo)
]
exclude = [
    "musl-exo",
    "vendors",
    "wayland-rs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Exo-OS Team"]
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
bincode = "1.3"
bytemuck = "1.17"
bitflags = "2.4"
log = { version = "0.4", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure", "no_avx2", "no_avx512"] }
argon2 = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
debug = true

[patch.crates-io]
libc = { path = "vendors/libc" }
