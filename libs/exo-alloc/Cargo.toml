[package]
name = "exo-alloc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
global-alloc = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("exo"))'] }

[dependencies]
exo-abi = { path = "../exo-abi" }
exo-phoenix-ssr = { path = "../exo-phoenix-ssr" }
