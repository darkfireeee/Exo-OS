[package]
name = "exo-virtio-blk"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "virtio_blk_driver"
path = "src/main.rs"
test = false
bench = false

[dependencies]
virtio-drivers = { version = "0.7.2", default-features = false }
spin = { workspace = true }
log = { workspace = true }
exo-syscall-abi = { path = "../../../servers/syscall_abi" }
exo-storage-common-hal = { path = "../common_hal" }

[features]
default = []
