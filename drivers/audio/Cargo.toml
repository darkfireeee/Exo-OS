[package]
name = "exo-audio-drivers"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
name = "exo_audio_drivers"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
spin = { workspace = true }
exo_syscall_abi = { package = "exo-srv-rt", path = "../../libs/exo-srv-rt" }
exo-os-drivers = { path = ".." }

[features]
default = []
