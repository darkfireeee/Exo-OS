[graph]
targets = [
    { triple = "x86_64-unknown-none" },
]

[advisories]
unmaintained = "all"
unsound = "all"
ignore = [
    "RUSTSEC-2026-0097", # proptest dev-dependency rand 0.9.2
    # Transitive heapless 0.8.0 pinned by smoltcp 0.12.0 (Ring 1 network_server, single-threaded panic=abort;
    # affected APIs SortedLinkedList/Spsc/Treiber/Deque::try_from/make_contiguous/IndexMap::truncate/u16::MAX are unused).
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { name = "bitflags", version = "1.3.2", reason = "smoltcp 0.12 still depends on bitflags 1.x; keep the duplicate explicit until smoltcp is upgraded" },
]
deny = [
    { name = "libsodium-sys", reason = "FFI C dependency is not allowed in the Exo-OS kernel/server base; use RustCrypto or an audited no_std path" },
    { name = "libsodium", reason = "Use the audited ExoOS/RustCrypto path instead" },
    { name = "openssl", reason = "Use the audited ExoOS/RustCrypto path instead" },
    { name = "ring", reason = "Requires explicit evaluation before being allowed in ExoOS" },
    { name = "dbus", reason = "D-Bus is incompatible with the Exo-OS IPC model" },
    { name = "zbus", reason = "D-Bus is incompatible with the Exo-OS IPC model" },
    { name = "tokio", version = "*", reason = "Tokio runtime is not part of the Exo-OS runtime contract" },
    { name = "tokio-runtime", reason = "Tokio runtime is not part of the Exo-OS runtime contract" },
    { name = "async-std", reason = "async-std is redundant with the Exo-OS runtime model" },
    { name = "systemd", reason = "systemd is incompatible with the Exo-OS boot and service model" },
    { name = "linux-pam", reason = "PAM is rejected in Exo-OS Zero-Trust architecture" },
    { name = "shadow-rs", reason = "shadow-rs is rejected in favor of native build metadata" },
    { name = "libfuse", reason = "libfuse is incompatible with the out-of-kernel ExoFS model" },
    { name = "rtnetlink", reason = "rtnetlink is rejected in favor of ExoNet V5 NetGrant" },
    { name = "relibc", reason = "External unmodified relibc is rejected (LIB-09 / O-10); use local libs/exo-libc (Pal for ExoOs) and exo-alloc" },
    { name = "pkgcraft", reason = "pkgcraft is rejected in favor of native exo-pkg format" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
