[package]
name              = "exo-exosh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description       = "Exo-OS interactive shell (std + exo-rt)"

[[bin]]
name = "exosh"
path = "src/main.rs"
test = false
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("exo"))'] }

[dependencies]
exo-syscall-abi = { path = "../syscall_abi" }
exo-std = { path = "../../library/std" }
exo-rt = { path = "../../libs/exo-rt" }
exo-alloc = { path = "../../libs/exo-alloc", features = ["global-alloc"] }
exo-libc = { path = "../../libs/exo-libc" }
