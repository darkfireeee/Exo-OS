[package]
name        = "exo-ext-server"
version     = "0.1.0"
edition     = "2021"
authors     = ["Exo-OS Team"]
license     = "MIT OR Apache-2.0"
description = "Exo-OS ext4 Filesystem Ring 1 Server"

[[bin]]
name = "exo-ext-server"
path = "src/main.rs"

[dependencies]
exo-syscall-abi  = { path = "../syscall_abi" }
exo-os-driver-fs = { path = "../../drivers/fs" }
spin             = { version = "0.9", default-features = false, features = ["spin_mutex"] }
