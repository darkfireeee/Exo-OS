[package]
name = "exo-coreutils"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("exo"))'] }

[dependencies]
exo-syscall-abi = { path = "../../../servers/syscall_abi" }

[target.'cfg(target_os = "none")'.dependencies]
exo-rt = { path = "../../../libs/exo-rt" }
exo-alloc = { path = "../../../libs/exo-alloc", features = ["global-alloc"] }
