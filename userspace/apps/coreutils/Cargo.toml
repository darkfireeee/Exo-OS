[package]
name = "exo-coreutils"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("exo"))'] }

[dependencies]
exo_syscall_abi = { package = "exo-srv-rt", path = "../../../libs/exo-srv-rt" }

[target.'cfg(target_os = "none")'.dependencies]
exo-rt = { path = "../../../libs/exo-rt" }
exo-alloc = { path = "../../../libs/exo-alloc", features = ["global-alloc"] }
